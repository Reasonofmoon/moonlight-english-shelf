<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonlight English · 상품 목록 편집</title><style>*{box-sizing:border-box}body{margin:30px auto;padding:0 18px;max-width:770px;background:#f8f7ef;color:#173b31;font:16px/1.55 system-ui}h1{font-size:30px;line-height:1.2}h2{font-size:19px}section{background:#fff;border:1px solid #cbd3c7;border-radius:9px;padding:18px;margin:16px 0}label{display:block;margin:8px 0;font-weight:600}input:not([type=checkbox]),select{display:block;width:100%;padding:9px;border:1px solid #8ea797;border-radius:5px;font:inherit}select{min-height:9em}button,a{font:inherit}button{padding:7px 11px;margin:4px;border:1px solid #638277;background:#f2f5ed;color:#173b31;border-radius:4px;cursor:pointer}a{color:#155442}output{display:block;position:sticky;bottom:0;background:#173b31;color:white;padding:9px;border-radius:5px}small{display:block;color:#485b52}</style><main><a href="./">← 판매 페이지</a><h1>상품 목록 업데이트</h1><p>이 도구는 브라우저에서만 동작합니다. 여기서 수정해도 공개 사이트는 바뀌지 않습니다. 완료한 파일을 저장소에 커밋해야 반영됩니다.</p><section><h2>1. 상품 선택</h2><label>상품명 또는 ID<input id="query" placeholder="예: Judy Moody"></label><select id="list" size="5" aria-label="상품 목록"></select><button id="new">새 상품 입력</button></section><section><h2>2. 상품 정보</h2><label>상품 ID<input id="pid" inputmode="numeric"></label><label>영어 상품명<input id="title"></label><label>TPT 상품 URL<input id="url" type="url"></label><label>공개 표지 이미지 URL<input id="cover" type="url"></label><label>TPT 판매순 위치<input id="rank" type="number" min="1" placeholder="모르면 비워두세요"></label><small>순위를 바꾸면 다른 상품은 기존 순서를 유지한 채 한 칸씩 이동합니다.</small><label><input id="featured" type="checkbox"> 이 상품을 최신 등록 상품으로 표시</label><button id="apply">목록에 적용</button><button id="remove">목록에서 제외</button></section><section><h2>3. 검증하고 반영</h2><label>상품 목록 확인 날짜<input id="date" type="date"></label><button id="export">검증 후 catalog.json 다운로드</button><p><a href="https://github.com/Reasonofmoon/moonlight-english-shelf/upload/main" target="_blank" rel="noopener">GitHub에 파일 올리기 ↗</a> → <b>Commit changes</b>. 파일명이 정확히 <code>catalog.json</code>인지 확인하세요. 다른 편집자가 먼저 갱신했다면 페이지를 새로 열고 다시 적용하세요.</p></section><output role="status" id="status">현재 목록을 불러오는 중입니다.</output></main><script src="./manage.js" type="module"></script></html>
